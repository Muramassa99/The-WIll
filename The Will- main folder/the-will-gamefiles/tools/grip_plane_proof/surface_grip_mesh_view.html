<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Actual grip mesh</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20242a;color:#e7edf4;font:15px system-ui}header{padding:18px 24px;background:#141a21}h1{font-size:22px;margin:0 0 8px}p{margin:7px 0;color:#b9c7d6}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}button{background:#354556;color:white;border:1px solid #66778b;border-radius:5px;padding:7px 12px;cursor:pointer}canvas{display:block;width:100vw;height:78vh;touch-action:none}label{white-space:nowrap}details{padding:10px 24px;font-size:12px;overflow-wrap:anywhere}
</style>
<header><h1 id="title"></h1><p id="status"></p><div class="controls"><span>Drag to orbit · wheel to zoom</span><button id="reset">Reset view</button><button id="flip">Opposite side</button><label><input type="checkbox" id="bones"> Bones</label><label><input type="checkbox" id="wire"> Mesh edges</label><label><input type="checkbox" id="hide"> Hide handle</label></div></header>
<canvas id="view"></canvas><details><summary>Observation source</summary><p id="source"></p><p>Actual captured skin and physical handle. This view does not rerun the solver or establish whole-mesh collision certification. The display clips the handle length around the hand; it does not alter the saved geometry.</p></details>
<script>
const D=__REPORT__,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
document.querySelector('#title').textContent=D.weapon_name+' — '+D.slot+' actual mesh';
document.querySelector('#status').textContent=(D.solver_ms/1000).toFixed(3)+' s · Physical contact: '+D.physically_engaged_sections.length+'/14 sections · Maximum depth: '+D.maximum_depth_sections.length+'/14 · Palm: '+(D.palm_engaged?'in contact':'gap')+' · Sampled overlap checks: '+(D.sampled_material_safe?'passed':'failed');
document.querySelector('#source').textContent=D.source_capture+' · SHA256 '+D.source_capture_sha256;
const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
D.hand.flat().forEach(p=>p.forEach((v,i)=>{lo[i]=Math.min(lo[i],v);hi[i]=Math.max(hi[i],v)}));
const center=lo.map((v,i)=>(v+hi[i])/2),span=Math.max(...hi.map((v,i)=>v-lo[i]));
function clip(poly,axis,bound,sign){let out=[],a=poly.at(-1),da=(a[axis]-bound)*sign;for(const b of poly){let db=(b[axis]-bound)*sign;if((da>=0)!=(db>=0)){let t=da/(da-db);out.push(a.map((v,i)=>v+t*(b[i]-v)))}if(db>=0)out.push(b);a=b;da=db}return out}
const weapon=[];for(const face of D.weapon){let poly=face;for(let i=0;i<3&&poly.length;i++){poly=clip(poly,i,lo[i]-25,1);if(poly.length)poly=clip(poly,i,hi[i]+25,-1)}for(let i=1;i+1<poly.length;i++)weapon.push([poly[0],poly[i],poly[i+1]])}
let yaw=.5,pitch=-.5,zoom=1,down=null;
function rotate(p){let q=p.map((v,i)=>v-center[i]),c=Math.cos(yaw),s=Math.sin(yaw),x=c*q[0]+s*q[2],z=-s*q[0]+c*q[2],a=Math.cos(pitch),b=Math.sin(pitch);return [x,a*q[1]-b*z,b*q[1]+a*z]}
function draw(){let scale=Math.min(canvas.width,canvas.height)*.72/span*zoom,px=p=>[canvas.width/2+p[0]*scale,canvas.height/2-p[1]*scale];ctx.clearRect(0,0,canvas.width,canvas.height);const faces=[];for(const [mesh,skin] of [[D.hand,true],[weapon,false]]){if(!skin&&document.querySelector('#hide').checked)continue;for(const face of mesh){let p=face.map(rotate),u=p[1].map((v,i)=>v-p[0][i]),v=p[2].map((v,i)=>v-p[0][i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],length=Math.hypot(...n)||1,light=.50+.50*Math.abs((n[0]*.3+n[1]*.45+n[2]*.84)/length);faces.push({p,z:p.reduce((s,q)=>s+q[2],0)/3,skin,light})}}faces.sort((a,b)=>a.z-b.z);for(const f of faces){const p=f.p.map(px);ctx.beginPath();ctx.moveTo(...p[0]);ctx.lineTo(...p[1]);ctx.lineTo(...p[2]);ctx.closePath();let rgb=f.skin?[245,190,158]:[157,183,199];ctx.fillStyle='rgb('+rgb.map(v=>Math.round(v*f.light)).join(',')+')';ctx.fill();if(document.querySelector('#wire').checked){ctx.strokeStyle='#26333b88';ctx.lineWidth=.6;ctx.stroke()}}if(document.querySelector('#bones').checked){ctx.strokeStyle='#ff326a';ctx.lineWidth=2;for(const chain of D.joints){ctx.beginPath();chain.map(rotate).map(px).forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}}}
function size(){const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;draw()}window.addEventListener('resize',size);canvas.onpointerdown=e=>{down=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!down)return;yaw+=(e.clientX-down[0])*.008;pitch+=(e.clientY-down[1])*.008;down=[e.clientX,e.clientY];draw()};canvas.onpointerup=()=>down=null;canvas.onpointercancel=()=>down=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw()};document.querySelector('#reset').onclick=()=>{yaw=.5;pitch=-.5;zoom=1;draw()};document.querySelector('#flip').onclick=()=>{yaw+=Math.PI;draw()};document.querySelectorAll('input').forEach(e=>e.onchange=draw);size();
</script></html>
